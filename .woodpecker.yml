steps:
  build:
    image: node:20-alpine
    commands:
      - echo "Running build stage"
    when:
      event: manual
      evaluate: STAGE == "build"

  test:
    image: alpine
    commands:
      - echo "Running test stage"
    when:
      event: manual
      evaluate: STAGE == "test"

  deploy:
    image: alpine
    commands:
      - echo "Running deploy stage"
    when:
      event: manual
      evaluate: STAGE == "deploy"