---
kind: pipeline
type: docker
name: build

trigger:
  event:
    - custom
  target:
    - build

steps:
  - name: install
    image: node:20-alpine
    commands:
      - cd app
      - npm install

  - name: build
    image: node:20-alpine
    commands:
      - cd app
      - npm run build
      - tar -czf app-build.tar.gz dist

  - name: verify
    image: alpine
    commands:
      - ls -lh app/app-build.tar.gz

---
kind: pipeline
type: docker
name: deploy

trigger:
  event:
    - custom
  target:
    - deploy

steps:
  - name: deploy
    image: alpine
    commands:
      - echo "deploying..."