events {
    worker_connections 1024;
}

http {
    server {
        listen 80 http2;
        server_name _;

        location / {
            return 200 'Hello World!';
            add_header Content-Type text/plain;
        }

        location /drone {
            proxy_pass http://drone-server;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
